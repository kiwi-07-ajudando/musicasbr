<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escolha seu pacote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F2F4F1;
    --surface: #FFFFFF;
    --ink: #10231D;
    --ink-soft: #4B5B54;
    --teal: #0E8F7F;
    --teal-deep: #0B3B36;
    --line: #D9DED9;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 16px 56px;
  }

  header{
    text-align:center;
    max-width:420px;
    margin-bottom:34px;
  }

  header .eyebrow{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 8px;
  }

  header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:30px;
    margin:0;
    letter-spacing:-0.01em;
  }

  .plans{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .plan-card{
    background:var(--surface);
    border:1px solid var(--line);
    padding:22px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    cursor:pointer;
    transition:border-color .15s ease;
  }

  .plan-card:hover{ border-color: var(--teal); }

  .plan-card .info h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    margin:0 0 4px;
  }

  .plan-card .info p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .plan-card .price{
    text-align:right;
    flex-shrink:0;
  }

  .plan-card .price .value{
    font-family:'Fraunces', serif;
    font-size:24px;
    font-weight:500;
    white-space:nowrap;
  }

  .plan-card .price .value sup{
    font-size:13px;
    font-weight:500;
  }

  .plan-card .price .cta{
    display:block;
    margin-top:4px;
    font-size:12.5px;
    color:var(--teal);
    font-weight:500;
  }

  /* Destaque no pacote do meio, como opção recomendada */
  .plan-card.featured{
    border-color: var(--teal);
    border-width:1.5px;
    position:relative;
  }

  .plan-card.featured .badge{
    position:absolute;
    top:-10px;
    left:22px;
    background:var(--teal);
    color:#fff;
    font-size:11.5px;
    font-weight:500;
    padding:3px 9px;
  }

  .loading, .error{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:20px;
  }

  .footnote{
    max-width:420px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:26px;
    line-height:1.6;
  }
</style>
</head>
<body>

  <header>
    <p class="eyebrow">Sua Loja</p>
    <h1>Escolha seu pacote</h1>
  </header>

  <div class="plans" id="plansList">
    <p class="loading">Carregando pacotes…</p>
  </div>

  <p class="footnote">Pagamento via Pix. Você poderá revisar o valor antes de confirmar.</p>

<script>
  const API_BASE_URL = ''; // se os .php estiverem noutro domínio/pasta, termine com "/"

  // Textos de apoio exibidos abaixo do nome de cada pacote (opcional).
  const PLAN_TAGLINES = {
    bronze: 'Ideal para começar',
    prata: 'O mais escolhido',
    ouro: 'Acesso completo',
  };

  function formatBRL(value){
    return Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function carregarPacotes(){
    const container = document.getElementById('plansList');

    try{
      const res = await fetch(`${API_BASE_URL}listar-planos.php`);
      const data = await res.json();

      if(!res.ok || !data.plans?.length){
        throw new Error('Não foi possível carregar os pacotes.');
      }

      container.innerHTML = '';

      data.plans.forEach((plan, index) => {
        const card = document.createElement('a');
        card.href = `checkout.html?plano=${encodeURIComponent(plan.id)}`;
        card.className = 'plan-card' + (index === 1 ? ' featured' : '');
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';

        card.innerHTML = `
          ${index === 1 ? '<span class="badge">Mais escolhido</span>' : ''}
          <div class="info">
            <h2>${plan.name}</h2>
            <p>${PLAN_TAGLINES[plan.id] || ''}</p>
          </div>
          <div class="price">
            <span class="value"><sup>R$</sup>${formatBRL(plan.amount)}</span>
            <span class="cta">Escolher este</span>
          </div>
        `;

        container.appendChild(card);
      });

    }catch(err){
      container.innerHTML = `<p class="error">${err.message}</p>`;
    }
  }

  carregarPacotes();
</script>

</body>
</html>
